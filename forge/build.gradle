plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.40'
}

// :common is a separate MDG project.  Evaluate it before reading its source
// set here; configuration-on-demand otherwise leaves sourceSets unavailable.
evaluationDependsOn(':common')

base {
    archivesName = archive_name
}

version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDir = rootProject.file('runs/forge-client')
        }
        server {
            workingDir = rootProject.file('runs/forge-server')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    implementation(project(':common')) {
        transitive = false
    }
}

// Generate META-INF/mods.toml from a template, keeping placeholders out of the
// final jar.  This mirrors the Fabric/NeoForge metadata path and avoids
// IntelliJ's Gradle MatchingCopyAction warning.
def expandProps = [
    'mod_author'              : mod_author,
    'mod_name'                : mod_name,
    'mod_id'                  : mod_id,
    'archive_name'            : archive_name,
    'contributors'            : contributors,
    'license'                 : license,
    'description'             : description,
    'link_home'               : link_home,
    'link_src'                : link_src,
    'link_issues'             : link_issues,
    'version'                 : version,
    'java_version'            : java_version,
    'minecraft_version'       : minecraft_version,
    'forge_version'           : forge_version,
    'forge_loader_version'    : forge_loader_version,
    'forge_compatible_range'  : forge_compatible_range,
]

def generateModMetadata = tasks.register('generateModMetadata', Sync) {
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
    inputs.properties(expandProps)
    expand(expandProps)
}
sourceSets.main.resources.srcDir(generateModMetadata.flatMap { it.destinationDirectory })

processResources {
    dependsOn generateModMetadata

    // Merge common assets once.  The Forge-local mixin config must win over
    // common's config, which uses a newer compatibility level than vanilla
    // Mixin 0.8.7 supports.
    from(project(':common').sourceSets.main.resources) {
        exclude("${mod_id}.mixins.json")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ForgeGradle's Slime Launcher exposes project classes and resources as two
// separate classpath roots; FML then sees a "main" module and a separately
// scanned mod metadata directory, which can produce duplicate package exports.
// Build one development mod directory (classes + resources) and use it in
// place of the two project output roots for client/server runs.
def devModDir = layout.buildDirectory.dir('devmod')
def prepareDevMod = tasks.register('prepareDevMod', Sync) {
    from sourceSets.main.output
    // Common classes must live in the same mod module as the Forge entrypoint;
    // leaving common as a separate classpath jar splits net.minecraft types
    // across class loaders and breaks Identifier fields at construction time.
    from project(':common').sourceSets.main.output.classesDirs
    dependsOn project(':common').tasks.named('classes')
    into devModDir
}

tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach { task ->
    task.dependsOn prepareDevMod

    def commonProject = project(':common')
    def commonJar = commonProject.tasks.named('jar').flatMap { it.archiveFile }
    def excludedOutputs = sourceSets.main.output.files + commonProject.sourceSets.main.output.files
    def externalRuntimeClasspath = sourceSets.main.runtimeClasspath.filter { file ->
        !excludedOutputs.contains(file) && file != commonJar.get().asFile
    }

    if (task.hasProperty('runtimeClasspath')) {
        task.runtimeClasspath.setFrom(files(devModDir) + externalRuntimeClasspath)
    }

    task.doFirst {
        def excluded = sourceSets.main.output.files + commonProject.sourceSets.main.output.files
        def commonJarFile = commonJar.get().asFile
        task.classpath = files(devModDir) + task.classpath.filter { file ->
            !excluded.contains(file) && file != commonJarFile
        }
    }
}

jar {
    archiveClassifier = 'forge-26.3'

    manifest {
        attributes 'MixinConfigs': "${mod_id}.mixins.json"
    }

    dependsOn project(':common').tasks.named('classes')
    from project(':common').sourceSets.main.output.classesDirs

    from(rootProject.file('LICENSE')) {
        rename { it + '_pingforit' }
    }
    from(rootProject.file('THIRD-PARTY-NOTICES.md'))
}

// Skeleton phase: no mod tests yet.
tasks.named('test') {
    enabled = false
}
