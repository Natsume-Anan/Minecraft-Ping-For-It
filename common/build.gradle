plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version.toInteger()
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven { url = uri('https://repo.spongepowered.org/repository/maven-public') }
    maven { url = uri('https://maven.neoforged.net/releases') }
    maven { url = uri('https://api.modrinth.com/maven') }
    maven { url = uri('https://cursemaven.com') }
    maven { url = uri('https://maven.maxhenkel.de/repository/public') }
    maven { url = uri('https://maven.ryanhcode.dev/releases') }
}

neoForge {
    neoFormVersion = neo_form_version
}

// MDG attaches the Minecraft compile/runtime classpath to main by default;
// attach the same NeoForm 26.3 classpath to test so focused tests can compile
// and run without hand-built Minecraft jars.
neoForge.addModdingDependenciesTo(sourceSets.test)

dependencies {
    // Common/source compile dependencies (26.3).
    compileOnly 'org.spongepowered:mixin:0.8.7'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'org.projectlombok:lombok:1.18.44'
    annotationProcessor 'org.projectlombok:lombok:1.18.44'

    // Temporary 1.21.1-era optional API coordinates (see task-18): these only
    // keep the legacy integration sources compiling while 26.3 artifacts are
    // being re-resolved. They are not a claim of 26.3 runtime compatibility.
    compileOnly "maven.modrinth:DistantHorizonsApi:${distanthorizons_api_version}"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    compileOnly "curse.maven:ftbteams-404468:${ftbteams_version}"
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${sable_version}"

    // P0 test wiring: only the focused A1 presentation tests are enabled for now;
    // the full 188-test suite is triaged in P1/P2.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
    testCompileOnly 'org.ow2.asm:asm:9.10.1'
    testImplementation 'net.neoforged:mergetool:2.0.3:api'
    testImplementation 'net.neoforged:minecraft-dependencies:26.3'
}

test {
    useJUnitPlatform()
}

// P1-1..P1-3D focused whitelist: A1 presentation tests, policy/string tests,
// outline structural tests, NeoForge WorldAware structural test, and pure-JDK core tests.
// P1-2A only adds ExternalBlockOutlineTransformTest (2 tests); EntityOutlineStateTest
// (old instance/logger/snapshot API) is deferred to P2-2A-2B.
// P1-2B/P1-2C structural tests read mod-source-isolated/neoforge sources only;
// they do not compile isolated sources or prove runtime behavior.
// P1-3A adds MarkerIdTest (5), MarkerAnchorTest (4), ResolvedTargetTest (3).
// P1-3B adds TargetKeyTest (16), TargetIdentityTest (18), WeakIdentityCacheTest (2).
// P1-3C first batch adds SafeExceptionReportTest (7), ThrowableCausesTest (5).
// P1-3D adds MarkerSnapshotTest (6), MarkerWinnerTest (11); P1-3 pure-JDK batches complete.
// P2-2A-1 adds TestLevel + TestEntitySupport + EntityLocalGeometryRegistryTest (4)
// and RaycastCandidateFlowTest (7).
// P2-2A-2A adds MinecraftTargetSnapshotFactoryDetailedTest (1) and
// EntitySelectionBlacklistTest (3).
// P2-2A-2B rewrites EntityOutlineStateTest (7) for the static outline state API;
// P2-2A is complete at this point.
// P2-2B-B1 adds ClientConfigValidationTest (20) and ConfigurationNoticeSizeTest (2)
// after re-checking the old 14 failures against the current 26.3 bounds/defaults.
// P2-2B-B2 adds ServerConfigSerializationTest (3), ServerConfigUpdateTest (3) and
// ConfigHandlerVersionTest (19) for the server/version config assertions.
// P2-2B-B3 adds SyncDurationPolicyS2CPacketTest (3) and
// ClientMarkerDisplayDurationTest (4) for the duration policy assertions.
// P2-2B-B4 adds PingInteractionConfigValidationTest (1); P2-2B is complete here.
// P2-2D-A adds BlockPresentationCoverageRelationTest (1) with local source-id constants.
// P2-2D-BO1a adds BlockOutlineSpecLookupTest (3) for the spec constructor and
// BlockPresentationLookup.specFor filtering/metadata; old orphan tests stay out of the whitelist.
// P2-2D-BO2 adds BlockPresentationImmutabilityTest (1) for the List.copyOf subject guard.
// TestPlatformContextService stays as the ServiceLoader provider helper.
sourceSets.test.java {
    include 'nx/pingwheel/common/client/outline/BlockPresentationResolverTest.java'
    include 'nx/pingwheel/common/client/outline/BlockPresentationSubjectValidationTest.java'
    include 'nx/pingwheel/common/client/outline/BlockDisplayPolicyTest.java'
    include 'nx/pingwheel/common/client/outline/BlockDisplayWhitelistTest.java'
    include 'nx/pingwheel/common/math/EntitySelectionBlacklistDefaultRuleTest.java'
    include 'nx/pingwheel/common/client/outline/ExternalBlockOutlineTransformTest.java'
    include 'nx/pingwheel/common/client/outline/CreateLargeWaterWheelPresentationResolverContractTest.java'
    include 'nx/pingwheel/common/client/outline/SimulatedDockingConnectorPresentationResolverContractTest.java'
    include 'nx/pingwheel/common/client/outline/NeoForgeWorldAwareBlockModelOutlineAdapterContractTest.java'
    include 'nx/pingwheel/common/domain/MarkerIdTest.java'
    include 'nx/pingwheel/common/marker/MarkerAnchorTest.java'
    include 'nx/pingwheel/common/domain/ResolvedTargetTest.java'
    include 'nx/pingwheel/common/marker/TargetKeyTest.java'
    include 'nx/pingwheel/common/domain/TargetIdentityTest.java'
    include 'nx/pingwheel/common/util/WeakIdentityCacheTest.java'
    include 'nx/pingwheel/common/util/SafeExceptionReportTest.java'
    include 'nx/pingwheel/common/util/ThrowableCausesTest.java'
    include 'nx/pingwheel/common/marker/MarkerSnapshotTest.java'
    include 'nx/pingwheel/common/marker/MarkerWinnerTest.java'
    include 'nx/pingwheel/common/testing/TestLevel.java'
    include 'nx/pingwheel/common/client/outline/TestEntitySupport.java'
    include 'nx/pingwheel/common/math/EntityLocalGeometryRegistryTest.java'
    include 'nx/pingwheel/common/math/RaycastCandidateFlowTest.java'
    include 'nx/pingwheel/common/interaction/MinecraftTargetSnapshotFactoryDetailedTest.java'
    include 'nx/pingwheel/common/client/outline/EntitySelectionBlacklistTest.java'
    include 'nx/pingwheel/common/client/outline/EntityOutlineStateTest.java'
    include 'nx/pingwheel/common/config/ClientConfigValidationTest.java'
    include 'nx/pingwheel/common/config/ConfigurationNoticeSizeTest.java'
    include 'nx/pingwheel/common/config/ServerConfigSerializationTest.java'
    include 'nx/pingwheel/common/config/ServerConfigUpdateTest.java'
    include 'nx/pingwheel/common/config/ConfigHandlerVersionTest.java'
    include 'nx/pingwheel/common/network/SyncDurationPolicyS2CPacketTest.java'
    include 'nx/pingwheel/common/client/duration/ClientMarkerDisplayDurationTest.java'
    include 'nx/pingwheel/common/interaction/state/PingInteractionConfigValidationTest.java'
    include 'nx/pingwheel/common/client/outline/BlockPresentationCoverageRelationTest.java'
    include 'nx/pingwheel/common/client/outline/BlockOutlineSpecLookupTest.java'
    include 'nx/pingwheel/common/client/outline/BlockPresentationImmutabilityTest.java'
    include 'nx/pingwheel/common/config/TestPlatformContextService.java'
}

// P1-1..P1-3D focused tests are enabled; full-suite restoration is P2.
tasks.named('test') {
    enabled = true
}

// common is a library module; do not create competing runClient/runServer tasks.
tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    enabled = false
}