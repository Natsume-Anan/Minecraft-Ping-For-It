plugins {
    id "multiloader-common"
}

// Skeleton: this project compiles only `src/skeleton/java`, which has no game imports,
// so it is a plain Java library. Restoring the 1.21.1 tree restores ModDevGradle with it:
//
//     plugins { id "net.neoforged.moddev" }
//     neoForge { neoFormVersion = neo_form_version; accessTransformers.from(at) }   // NeoForm toolchain
//     def compiledMinecraft          = tasks.named('createMinecraftArtifacts', ...).flatMap { it.compiledArtifact }
//     def compiledMinecraftResources = tasks.named('createMinecraftArtifacts', ...).flatMap { it.resourcesArtifact }

dependencies {
    compileOnly group: "org.spongepowered", name: "mixin", version: "0.8.5"
    implementation group: "com.google.code.findbugs", name: "jsr305", version: "3.0.1"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    // Gradle 9 requires the JUnit Platform launcher on the test runtime classpath.
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
    // Skeleton: the ASM-based mixin contract tests, the Sable companion tests and the
    // `net.neoforged:minecraft-dependencies` runtime set all return with the migration.
}

test {
    useJUnitPlatform()
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
