plugins {
    id "multiloader-loader"
    id "fabric-loom" version "${loom_version}"
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // Skeleton: Parchment has no 26.3 mappings yet; official Mojang mappings only.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    // Skeleton: Fabric API returns with the migration.

    // Skeleton: ModMenu returns with the migration.

    // Headless tests exercise the native sided inventory wrappers.
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
}

test {
    useJUnitPlatform()
}

loom {
    accessWidenerPath = file("src/main/resources/pingforit.accesswidener")
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("runs/client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("runs/server")
        }
    }
}

tasks.named("remapJar") {
    archiveClassifier = "${project.name}-${minecraft_version}"
}
