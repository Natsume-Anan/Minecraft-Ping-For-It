pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = "Fabric"
                    url = uri("https://maven.fabricmc.net")
                }
            }
            filter {
                // 26.x builds with Loom's non-remapping plugin, whose plugin
                // marker lives in the net.fabricmc.fabric-loom subgroup.
                includeGroupAndSubgroups("net.fabricmc")
                includeGroup("fabric-loom")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Forge"
                    url = uri("https://maven.minecraftforge.net")
                }
            }
            filter {
                includeGroupAndSubgroups("net.minecraftforge")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Sponge Snapshots"
                    url = uri("https://repo.spongepowered.org/repository/maven-public")
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
    }
}

plugins {
    // Skeleton: JDK 25 is installed locally, so toolchain auto-download is not needed.
    // id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "Ping-For-It"
include("common")
include("fabric")
// Skeleton: Forge needs a ForgeGradle release for 26.3; restore when verified.
// include("forge")
include("neoforge")
