# Details
mod_author=Luken
mod_name=Ping For It
mod_id=pingforit
archive_name=Ping-For-It
contributors=RXJpaw
license=MIT
description=Mark locations similar to the ping mechanism found in modern co-op multiplayer games.
link_home=https://github.com/a-Void-Deer/Minecraft-Ping-For-It
link_src=https://github.com/a-Void-Deer/Minecraft-Ping-For-It
link_issues=https://github.com/a-Void-Deer/Minecraft-Ping-For-It/issues

# Common
mod_version=0.6.0-pfi-skeleton

# Minecraft
minecraft_version=26.3
java_version=25

## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# ModDevGradle
# https://projects.neoforged.net/neoforged/moddevgradle
mod_dev_gradle_version=2.0.148

# Parchment, Distant Horizons, Sable and the Create/Flywheel/Ponder integration
# are not part of the skeleton; their versions return with the port.

# Fabric
# https://fabricmc.net/develop/
fabric_loader_version=0.20.1
fabric_compatible_range=>=26.3 <26.4
# 26.x builds with Loom's NON-remapping plugin; 1.19.4 is the pinned release.
loom_version=1.19.4

# Forge
# https://files.minecraftforge.net/net/minecraftforge/forge/
forge_version=66.1.5
forge_loader_version=66
forge_compatible_range=[26.3,26.4)

# NeoForge
# https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.101
neoforge_compatible_range=[26.3,26.4)

# Gradle
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8
org.gradle.daemon=false

#idea
idea.disable.gradle.resource.filtering=true