plugins {
    id "multiloader-loader"
    id "net.neoforged.moddev"
}

neoForge {
    version = neoforge_version
    // Skeleton: the access transformer is comment-only, so it is not wired. Restore with
    // the port: accessTransformers.from(project(":common").file(".../accesstransformer.cfg"))
    // Parchment has no 26.3 mappings, so no mappings layer is configured.
    runs {
        configureEach {
            systemProperty("neoforge.enabledGameTestNamespaces", mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        // Skeleton: no datagen. MDG 2.0.148 rejects a run named "data"; the generator
        // runs are clientData/serverData. Restore both with the port.
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir "src/generated/resources" }

jar {
    archiveClassifier = "${project.name}-${minecraft_version}"
}

dependencies {
    // Skeleton: the Create/Flywheel/Ponder compile-only integration disabled with the
    // 1.21.1 sources, and the resolver tests that needed the compiled Minecraft jar,
    // FancyModLoader, Mergetool and Sponge Mixin return with the migration.
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    // Gradle 9 requires the JUnit Platform launcher on the test runtime classpath.
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

test {
    useJUnitPlatform()
}
