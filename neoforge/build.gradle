plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.neoforged.net/releases') }
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            gameDirectory = rootProject.file('runs/skeleton/neoforge-client')
        }
        server {
            server()
            gameDirectory = rootProject.file('runs/skeleton/neoforge-server')
        }
    }
}

// Skeleton phase: no mod sources, no mod tests.
tasks.named('test') {
    enabled = false
}
