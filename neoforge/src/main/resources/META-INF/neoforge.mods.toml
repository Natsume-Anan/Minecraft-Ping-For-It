modLoader = "javafml"
# Skeleton: loaderVersion is optional in 26.x and FancyModLoader is 12.x, so the old
# "[4,)" range is dropped until the loader contract is re-read for the target version.
license = "${license}"
issueTrackerURL = "${link_issues}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "${link_src}"
logoFile = "icon.png"
authors = "${mod_author}, ${contributors}"
description = '''${description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "pingforit.create-presentation.mixins.json"

[[mixins]]
config = "pingforit.create-preview.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${neoforge_compatible_range}"
ordering = "NONE"
side = "BOTH"
